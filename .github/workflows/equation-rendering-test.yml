name: Equation rendering test

on:
  push:
    branches:
      - reproducibility-clean-test

permissions:
  contents: read

jobs:
  render-equations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: reproducibility/requirements.txt
      - name: Install pinned dependencies
        working-directory: reproducibility
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Render all 17 manuscript equations
        working-directory: reproducibility
        run: python eqs.py
      - name: Validate equation images
        working-directory: reproducibility
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path("eqs").glob("eq*.png"))
          expected = [Path("eqs") / f"eq{i}.png" for i in range(1, 18)]
          missing = [str(p) for p in expected if not p.is_file() or p.stat().st_size == 0]
          if missing:
              raise SystemExit("Missing or empty equation images: " + ", ".join(missing))
          if len(files) != 17:
              raise SystemExit(f"Expected exactly 17 equation images, found {len(files)}")
          print("EQUATION_RENDER_VALIDATION_OK: 17 non-empty PNG files")
          PY
      - name: Upload equation images
        uses: actions/upload-artifact@v4
        with:
          name: equation-rendering-test
          path: reproducibility/eqs/*.png
          retention-days: 14
